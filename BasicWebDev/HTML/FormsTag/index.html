<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <label for="fullname">Full Name: </label>
    <input type="text" name="fullname" id="fullname" />
    <br /><br />
    <label for="address">Address: </label>
    <input type="text" />
    <br /><br />
    <label for="password">Password: </label>
    <input type="password" name="password" id="password" />
    <br /><br />
    <label for="email">Email: </label>
    <input type="email" name="email" id="email" />
    <br /><br />
    <label for="mobilenumber">Mobile Number: </label>
    <input type="number" name="mobilenumber" id="mobilenumber" />
    <br /><br />
    <label for="date">Date: </label>
    <input type="date" name="date" id="date" />
    <br /><br />
    <label for="time">Time: </label>
    <input type="time" name="time" id="time" />
    <br /><br />
    <label for="dateandtime">Date and Time: </label>
    <input type="datetime-local" name="dateandtime" id="dateandtime" />
    <br /><br />
    <label for="range">Range: </label>
    <input type="range" name="range" id="range" />
    <br /><br />
    <label for="file">File: </label>
    <input type="file" name="file" id="file" />
    <br /><br />
    <label for="choosecolor">Choose Color: </label>
    <input type="color" name="choosecolor" id="choosecolor" />
    <br /><br />
    <label for="gender">Gender: </label>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male" value="male" />
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female" value="female" />
    <label for="others">Others</label>
    <input type="radio" name="gender" id="others" value="others" />
    <br /><br />
    <label for="knowlanguage">Know Language's: </label>
    <input type="checkbox" name="knowlanguage" id="knowlanguage" />
    <br /><br />
    <label for="city">City Name: </label>
    <select name="" id="">
      <option value=""></option>
      <option value="bhopal">Bhopal</option>
      <option value="indore">Indore</option>
      <option value="jabalpur">Jabalpur</option>
      <option value="gwalior">Gwalior</option>
    </select>
    <br /><br />
    <button>Submit</button>
  </body>
</html>
