<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <fieldset>
      <div>
        <label for="fullName">FullName :</label>
        <input type="text" name="fullName" id="fullName" />
      </div>
      <br>
      <div>
        <label for="password">Password :</label>
        <input type="password" name="password" id="password" />
      </div>
      <br>
      <div>
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" />
      </div>
      <br>
      <div>
        <label for="phone">Phone :</label>
        <input type="number" name="phone" id="phone" />
      </div>
      <br>
      <div>
        <label for="date">DOB :</label>
        <input type="date" name="date" id="date" />
      </div>
      <br>
      <div>
        <label for="tob">TOB :</label>
        <input type="time" name="tob" id="time" />
      </div>
      <br>
      <div>
        <label for="occation">Occation :</label>
        <input type="datetime-local" name="occation" id="occation" />
      </div>
      <br>
      <div>
        <label for="volume">Volume :</label>
        <input type="range" name="Volume" id="volume" />
      </div>
      <br>
      <div>
        <label for="bgColor">Color Picker :</label>
        <input type="color" name="bgColor" id="bgColor" />
      </div>
      <br>
      <div>
        <label for="phone">Phone :</label>
        <input type="number" name="phone" id="phone" />
      </div>
      <br>
      
    </fieldset>
    <br />
  </body>
</html>
