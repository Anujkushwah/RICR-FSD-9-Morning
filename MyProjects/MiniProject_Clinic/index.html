<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index - Clinic Bootstrap Template</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <header>
      <div class="head-outer-div" id="head">
        <div class="head-inner-div" id="contact-div">
          <i class="bi bi-envelope"></i>
          <a href="contact@example.com">contact@example.com</a>
          <i class="bi bi-phone"></i>
          <span id="head-inner-span">+1 5589 55488 55</span>
        </div>
        <div class="head-inner-div" id="social-div">
          <i class="bi bi-twitter-x"></i>
          <i class="bi bi-facebook"></i>
          <i class="bi bi-instagram"></i>
          <i class="bi bi-linkedin"></i>
        </div>
      </div>

      <div id="head-menu">
        <div id="head-menu-company-name">
          <span>Clinic</span>
        </div>
        <div id="head-menu-div2">
          <ul>
            <li><a href="">Home</a></li>
            <li><a href="">About</a></li>
            <li><a href="">Department</a></li>
            <li><a href="">Services</a></li>
            <li><a href="">Doctors</a></li>
            <li><a href="">More Pages</a></li>
            <li><a href="">Dropdown</a></li>
            <li><a href="">Contact</a></li>
          </ul>
        </div>
      </div>
    </header>

    <main>
        <section id="hero1">
            <div class="hero-section" id="hero1-decription">
                <div class="hero-section-top">
                    <i class="bi bi-shield-check"></i>
                    <span>Accredited</span>
                </div>
                <div class="hero-section-top">
                    <i class="bi bi-clock-fill"></i>
                    <span>24/7 Emergency</span>
                </div>
                <div class="hero-section-top">
                    <i class="bi bi-star-fill"></i>
                    <span>4.9/5 Rating</span>
                </div>
            </div>
            <div class="hero-section" id="hero1-image">
                <img src="./Images/staff-10.webp" alt="schedule-img">
            </div>
        </section>
    </main>


  </body>
</html>
