<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <header>
        <h1>My Todo List</h1>
        <h3>Organize your day, one task at a time</h3>
    </header>

    <section id="task-section">
        <input type="text">
        <button>Task</button>
    </section>


    <div class="container py-5">
        <div class="card shadow mx-auto">
            <div class="card-header bg-primary text-white">
                <h1 class="h3 mb-0">My Todo List</h1>
            </div>

            <div class="card-body">
                <form id="todoForm">
                    <div class="input-group">
                        <input type="text" id="todoInput" class="form-control" placeholder="Enter a new task...">

                        <button type="submit" class="btn btn-success">
                            Add Task
                        </button>
                    </div>
                </form>

                <ul id="todoList" class="list-group mt-4"></ul>
            </div>
        </div>
    </div>


    <footer>
        <span>Stay organized and Keep moving forward!</span>
    </footer>
    <script src="script.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
