<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign UP</title>
    <link rel="stylesheet" href="../CSS/MainCSS/mainStyle.css">
</head>
<body>
    <div>
        <fieldset class="card">
            <legend>Personal details</legend>
            <label for="firstName">First Name:</label>
            <input type="text" class="firstName" id="firstName">
            <br><br>
            <label for="midName">Middle Name:</label>
            <input type="text" class="midName" id="midName">
            <br><br>
            <label for="lastName">Last Name:</label>
            <input type="text" class="lastName" id="lastName">
            <br><br>
            <label for="dob">Date Of Birth:</label>
            <input type="date" class="dob" id="dob">
            <br><br>
            <label for="gender">Gender:</label>
            <input type="radio" class="gender" id="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" class="gender" id="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" class="gender" id="gender" value="other">
            <label for="other">Other</label>
            <br><br>
        </fieldset>

        <fieldset class="card">
            <legend>Education details</legend>
        </fieldset>

        <fieldset class="card">
            <legend>Citizenship details</legend>
        </fieldset>
        
        <fieldset class="card">
            <legend>Communication details</legend>
            <label for="email">Email:</label>
            <input type="email" class="email" id="email">
            <br><br>
            <label for="mobile">Mobile:</label>
            <input type="number" class="mobile" id="mobile">
            <br><br>
        </fieldset>

        <fieldset class="card">
            <legend>Address</legend>
            <label for="address">Email:</label>
            <input type="email" class="email" id="email">
            <br><br>
        </fieldset>

        <fieldset class="card">
            <legend>Passport</legend>
        </fieldset>

        <fieldset class="card">
            <legend>Driving licence</legend>
        </fieldset>
        <fieldset class="card">
            <legend>Family and Emergency Contact:</legend>
        </fieldset>
    </div>
</body>
</html>
